# DAST (Section 16): OWASP ZAP Baseline (passive/baseline scanning only --
# never an active attack) against a locally-built-and-launched instance of
# the app, running with development authentication so ZAP has authenticated
# pages to explore. This must never point at a production deployment.
name: DAST (ZAP baseline)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: service_desk
          POSTGRES_PASSWORD: service_desk_dev_password
          POSTGRES_DB: service_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U service_desk -d service_desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://service_desk:service_desk_dev_password@localhost:5432/service_desk?schema=public"
      AUTH_SECRET: "ci-only-not-a-real-secret-00000000000000000000"
      ENTRA_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      ENABLE_DEV_AUTH: "true"
      APP_BASE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4 # v4.2.2

      - uses: pnpm/action-setup@v4 # v4.1.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy && pnpm db:search:setup

      - name: Seed safe test data
        run: pnpm db:seed

      - name: Build (dev-auth disabled for the build phase; see src/lib/env.ts)
        run: pnpm build:e2e

      # Not `node .next/standalone/server.js`: the launcher Next generates
      # sets NODE_ENV=production on its fifth line, before anything else
      # loads, so the NODE_ENV=test above never took effect and src/lib/env.ts
      # refused to start with dev auth -- every request, /api/health included,
      # 500ed out of middleware and this job could not get past the wait
      # below. scripts/e2e-server.ts is that launcher without the overwrite,
      # and it also copies .next/static, which standalone does not, so ZAP
      # scans a page that actually loads its assets.
      - name: Launch the app with development authentication
        run: |
          nohup pnpm e2e:server > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "App is healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time."
          cat server.log || true
          exit 1

      - name: ZAP Baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:3000/login"
          rules_file_name: "zap/rules.tsv"
          cmd_options: "-a"
          fail_action: true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4 # v4.6.0
        with:
          name: zap-reports
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Shut down the app
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
          pkill -f "scripts/e2e-server.ts" || true
