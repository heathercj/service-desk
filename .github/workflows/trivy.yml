# Container and configuration scanning (Section 16): filesystem/dependency
# scan as defense in depth, Dockerfile misconfiguration check, and a scan of
# the built container image.
name: Trivy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fs-and-config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4.2.2

      - name: Trivy filesystem + config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          # See the note on the image scan below.
          ignore-unfixed: true

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4.2.2

      - name: Build image
        run: docker build -t service-desk:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: service-desk:ci
          scan-type: image
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Fail only on vulnerabilities that have a fix available. A Debian
          # base image always carries some HIGH CVEs that upstream has not
          # patched, so without this the gate is red permanently and stops
          # being read -- which is worse than not having it. Anything with a
          # fix is actionable: rebuild on a newer base tag, or bump the
          # package. Unfixed findings still appear in the job output.
          ignore-unfixed: true
