- type: heading
  level: 2
  text: Communication at Each Stage
- type: table
  columns:
  - Ticket Stage
  - Your Communication Responsibility
  rows:
  - Ticket Stage: Ticket accepted
    Your Communication Responsibility: Send acknowledgement with expected update timeframe
  - Ticket Stage: Still in progress (>1 day)
    Your Communication Responsibility: Send a brief progress update even if there's nothing new to report
  - Ticket Stage: Waiting on information
    Your Communication Responsibility: Ask clearly, ask once, give a deadline for response
  - Ticket Stage: Ready to resolve
    Your Communication Responsibility: Confirm resolution with user before closing
  - Ticket Stage: Ticket closed
    Your Communication Responsibility: Contact user to let them know â system does not auto-notify
  - Ticket Stage: Reassigning
    Your Communication Responsibility: Leave a full handoff note; honour any promises made to the user
