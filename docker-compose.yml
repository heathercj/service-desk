name: service-desk

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: service_desk
      POSTGRES_PASSWORD: service_desk_dev_password
      POSTGRES_DB: service_desk
    ports:
      - "5433:5432"
    volumes:
      - service_desk_pg_data:/var/lib/postgresql/data
      - ./scripts/init-pg-extensions.sql:/docker-entrypoint-initdb.d/init-pg-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_desk -d service_desk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  service_desk_pg_data:
